name: 'Build and Start Application'
description: 'Build the Next.js app and start it in background for testing'

inputs:
  admin-username:
    description: 'Admin username for the application'
    required: false
    default: 'admin'
  admin-password:
    description: 'Admin password for the application'
    required: false
    default: 'password123'
  log-level:
    description: 'Log level for the application'
    required: false
    default: 'error'

runs:
  using: 'composite'
  steps:
    - name: Create Reports Directory
      shell: bash
      run: mkdir -p reports/k6-summaries

    - name: Build Application
      shell: bash
      run: npm run build
      env:
        # `DATABASE_URL` vem do `env:` do job em `test-base.yml` (fonte única).
        JWT_SECRET: test-secret-for-build

    # Cria o usuário admin de que os testes k6 dependem. `initializeAuth()` (que
    # faz a criação) é chamada apenas por `scripts/init-server.js`, e nenhum
    # workflow da CI rodava esse script — `seed-all.js` semeia posts, vídeos,
    # músicas e settings, mas não usuários. Sem este passo, todo login dos testes
    # recebia 401 e o helper `load-tests/helpers/auth.js:31` lançava
    # "Login falhou: 401", derrubando todos os cenários autenticados.
    - name: Seed Admin User
      shell: bash
      run: npm run db:init
      env:
        # `DATABASE_URL` vem do `env:` do job em `test-base.yml` (fonte única).
        DATABASE_SSL: 'false'
        # OBRIGATÓRIO: `scripts/init-server.js` importa `lib/auth/auth.js`, e o
        # topo desse módulo (linhas 34-51) faz `throw` na IMPORTAÇÃO quando
        # `JWT_SECRET` está ausente e `NODE_ENV` não é `development`/`test` — o
        # fallback de chave derivada é proibido fora desses dois ambientes
        # (decisão de segurança, commit 351d23aa). O runner do GitHub não define
        # `NODE_ENV` em step de `run:`, então sem esta linha o passo morria com
        # "JWT_SECRET environment variable is required outside
        # development/test environments" — foi o que reprovou o run 37611884637
        # (job `load-tests / run-tests`, step `Seed Admin User`).
        # O valor é o mesmo do passo `Start Application`: o seed não assina token
        # nenhum, mas manter uma única chave na action evita a leitura de que
        # aqui o segredo pode ser qualquer um.
        JWT_SECRET: test-jwt-secret-for-load-tests
        ADMIN_USERNAME: ${{ inputs.admin-username }}
        ADMIN_PASSWORD: ${{ inputs.admin-password }}

    # A saída do servidor vai para um arquivo no workspace, e não para o stdout
    # do step: com `npm start &` o processo sobrevive ao step, então o log ia
    # para o `/dev/null` do runner e sumia. Sem ele, um 500 em endpoint não tem
    # causa diagnosticável — foi o que ocorreu no run 37303670048, em que 12
    # testes reprovaram sem nenhuma pista do servidor. O passo
    # "App Server Log" em `test-base.yml` imprime o final deste arquivo.
    - name: Start Application (Background)
      shell: bash
      run: |
        npm start > "$APP_LOG" 2>&1 &
        # `--no-install` é deliberado: sem ele o `npx` CAÍ no download sob
        # demanda quando o binário não está em `node_modules/.bin`, o que
        # transformava o registry do npm em ponto de falha no meio do job (com a
        # app já no ar, step vermelho sem causa aparente) e trazia uma versão não
        # pinada e não reproduzível. `wait-on` é devDependency
        # (`^9.5.1`, resolvida pelo lockfile que o `npm ci` respeita), então com
        # `--no-install` o passo usa a versão instalada ou falha na hora —
        # fail-closed em vez de download silencioso.
        npx --no-install wait-on http://localhost:3000 --timeout 60000
      env:
        APP_LOG: ${{ github.workspace }}/app-server.log
        PORT: 3000
        NODE_ENV: production
        # O postgres de serviço do CI é `postgres:15` puro, sem SSL (`SHOW ssl;`
        # → off). Sem isto, qualquer consulta falharia com "The server does not
        # support SSL connections" — o SSL é decisão de transporte (DATABASE_SSL),
        # não de NODE_ENV.
        DATABASE_SSL: 'false'
        # Na CI a falha de banco deve abortar o start na hora: sem isto o check-env
        # só avisava, a app subia com o banco quebrada e todo endpoint devolvia 500
        # por ~7 minutos de k6 sem nenhum diagnóstico.
        CHECK_ENV_STRICT: 'true'
        # CI trata a aplicação como se houvesse 1 proxy confiável na frente:
        # os testes k6 mandam `X-Forwarded-For` para simular IPs de clientes
        # distintos e não caírem na whitelist de loopback.
        TRUST_PROXY: 'true'
        # `DATABASE_URL` vem do `env:` do job em `test-base.yml` (fonte única).
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-for-load-tests
        ADMIN_USERNAME: ${{ inputs.admin-username }}
        ADMIN_PASSWORD: ${{ inputs.admin-password }}
        LOG_LEVEL: ${{ inputs.log-level }}