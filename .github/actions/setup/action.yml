name: 'Setup Node.js Environment'
description: 'Setup Node.js with caching and install dependencies'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    # Alinhado com `engines.node` do package.json (24.21.0). Antes era 24.15.0,
    # o que fazia o `npm ci` emitir `EBADENGINE Unsupported engine` em TODO job
    # da CI — silenciosamente, porque sem `engine-strict` o npm só avisa. Um
    # patch atrás não muda comportamento, mas o aviso some do log e o ambiente
    # deixa de divergir do declarado.
    #
    # O npm NÃO é pinado aqui: o 24.21.0 já vem com 11.19.0, que satisfaz
    # `engines.npm: ">=11.19.0"`. Fixar um npm mais novo exigiria um
    # `npm install -g npm@X` em todo job — custo e superfície sem retorno.
    default: '24.21.0'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      shell: bash
      # `--no-audit --no-fund`: o `npm audit` roda por padrão ao final do `ci`
      # e adiciona dezenas de segundos a CADA job da CI sem bloquear nada —
      # nenhuma vulnerabilidade reprova o build aqui. A auditoria passa a ser
      # um step separado e explícito (`Audit Dependencies` em test-base.yml),
      # onde os 4 high viram falha visível em vez de texto de warning.
      #
      # Limite de duração via `timeout`, e NÃO via a chave `timeout-minutes`:
      # step de **composite action** não aceita `timeout-minutes` (o actionlint
      # local não pegou, mas o runner sim — foi o que reprovou os 4 jobs do run
      # 38190581378/38190581415 com
      # `TemplateValidationException ... Unexpected value 'timeout-minutes'`).
      # `timeout` é a chave correta e é entendida pelo shell do step.
      #
      # O que motivou o limite: um `npm ci` que conclui o trabalho mas não
      # encerra o processo (run 38133449606, tentativa 1 — o runner registrou
      # `Terminate orphan process: pid (2824) (npm ci)` após 2h59m) consumia a
      # janela inteira do job e matava a bateria de testes, que nem começava.
      # 20 min é folgado para o pior caso já observado (1105 pacotes a frio).
      run: timeout 20m npm ci --no-audit --no-fund
