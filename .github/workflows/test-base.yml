name: Test Base Workflow

on:
  workflow_call:
    inputs:
      test-type:
        required: true
        type: string
        description: 'Tipo de teste (load, security ou coverage)'
      run-command:
        required: true
        type: string
        description: 'Comando para executar os testes'
      skip-k6:
        required: false
        type: boolean
        default: false
        description: 'Pular instalação do k6 (usado para workflows que não precisam de k6)'
      seed-db:
        required: false
        type: boolean
        default: true
        description: 'Semear dados no banco de teste'
      skip-db-setup:
        required: false
        type: boolean
        default: false
        description: 'Pular o setup do banco de teste (para suítes que não acessam o Postgres, como a de cobertura)'
      extra-steps:
        required: false
        type: string
        default: ''
        description: 'Steps extras para executar ao final do job (ex.: upload de artifacts)'
      # Credenciais do admin repassadas a dois lugares: ao `build-app` (que
      # inicia a app com essas credenciais) e ao step `Run Tests` (onde os
      # scripts k6 leem ADMIN_USERNAME/ADMIN_PASSWORD via __ENV). Os defaults
      # são os mesmos de `.github/actions/build-app/action.yml` — sem isso os
      # inputs do build-app ficariam inalcançáveis para quem chama este
      # workflow, e as suítes autenticadas reprovariam.
      admin-username:
        required: false
        type: string
        default: 'admin'
        description: 'Usuário admin do build da app e das suítes autenticadas'
      admin-password:
        required: false
        type: string
        default: 'password123'
        description: 'Senha do admin do build da app e das suítes autenticadas'
      # Limite de duração do job. Um job que chama workflow reutilizável NÃO
      # aceita a chave `timeout-minutes` (GitHub: só `name`, `uses`, `with`,
      # `secrets`, `needs`, `if`, `permissions` — o actionlint reprová-la), então
      # o valor vem do chamador por aqui. 360 é o teto do GitHub (= default da
      # plataforma), ou seja, ausência de override mantém o comportamento atual.
      timeout-minutes:
        required: false
        type: number
        default: 360
        description: 'Limite em minutos do job de testes (máximo do GitHub: 360)'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # Vem do chamador via input: `timeout-minutes` não é chave válida num job de
    # chamada de workflow reutilizável (ver o input de mesmo nome acima).
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # Fonte única da string de conexão do job. Precisa estar no nível do job
    # (e não em cada step) porque dois consumidores a usam:
    #   1. `build-app` sobe a aplicação com ela;
    #   2. `Run Tests` — o orquestrador (`scripts/run-all-load-tests-sequentially.js`,
    #      linhas 185 e 231) dispara `seed-posts.js` e `clean-load-test-posts.js`
    #      como SUBPROCESSOS via `execSync`, que herdiam `process.env` do step.
    #      Sem `DATABASE_URL` no step, os dois abortam com "DATABASE_URL não
    #      definida" e a bateria roda contra o banco sem os posts extras —
    #      foi o que reprovou paginação/filtro/busca no run 37303670048.
    # As credenciais espelham o bloco `services.postgres` abaixo.
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/caminhar_test

    services:
      # Serviço PostgreSQL para o teste (isolado)
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: caminhar_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # `-U test_user -d caminhar_test` no health-cmd: sem isso o `pg_isready`
        # conecta com o usuário default do container (`root`), que não existe no
        # Postgres — o healthcheck "passa" mas o servidor registra um
        # `FATAL: role "root" does not exist` a cada 10s. Num run de 3h isso são
        # ~1000 linhas de ruído no log do serviço, escondendo a falha real.
        options: >-
          --health-cmd "pg_isready -U test_user -d caminhar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Serviço Redis para Rate Limiting/Cache
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Versões das actions oficiais: bump de 12/10/2026, depois da annotation
      # "Uh oh! Node.js 20 is deprecated ... forced to run on Node.js 24" que o
      # run 38246676774 (cron "Load Tests (k6)" #9) passou a emitir para
      # checkout/setup-node/upload-artifact@v4 (e, no `test-coverage.yml`,
      # download-artifact@v4 e github-script@v7). Breaking changes das release
      # notes verificados contra o uso deste repositório — nenhum se aplica:
      #  - `checkout` v5 = Node 24 (exige runner >= 2.327.1; o `ubuntu-latest`
      #    do GitHub já é compatível); v6 persiste credenciais num arquivo
      #    separado (transparente para nós); v7 = ESM e passa a BLOQUEAR checkout
      #    de fork em `pull_request_target`/`workflow_run` — nenhum workflow
      #    aqui usa esses gatilhos (só `push`, `pull_request`, `schedule`,
      #    `workflow_dispatch` e `workflow_call`).
      #  - `setup-node` v6 restringiu o cache automático a npm; aqui só existe
      #    `cache: 'npm'` e o repo tem `package-lock.json` (sem yarn/pnpm) ->
      #    sem efeito. v7 = ESM + novos outputs e deixou de exportar um
      #    `NODE_AUTH_TOKEN` dummy, que ninguém consome.
      #  - `upload-artifact` v5/v6 = Node 24; v7 acrescenta `archive: false`
      #    (upload sem empacotar, opt-in) e ESM. Os inputs usados aqui (`name`,
      #    `path`, `retention-days`, `if-no-files-found`) não mudaram.
      #  - `download-artifact` v5 mudou o `path` apenas no download por ID;
      #    aqui o download é SEMPRE por `name:` -> inalterado. v8 passou a ERRO
      #    (e não só avisar) em hash divergente e pula a descompactação de
      #    arquivo que não é zip.
      #  - `github-script` v8 = Node 24; v9 documenta dois breaks de runtime:
      #    `require('@actions/github')` deixa de funcionar e `getOctokit` passou a
      #    ser parâmetro injetado (redeclará-lo com `const`/`let` dá SyntaxError).
      #    Nenhum dos dois atinge este repo — nenhum script redeclara
      #    `getOctokit`, e ambos usam o objeto `github` já injetado com
      #    `secrets.GITHUB_TOKEN`.
      #    IMPORTANTE: o v9 NÃO removeu o `require` do escopo do script. Conferido
      #    no fonte (`dist/index.js`): o script continua sendo avaliado com
      #    `require: wrapRequire` injetado, um Proxy sobre o `require` do bundle
      #    que resolve `fs`/`node:fs`. Uma versão anterior deste comentário
      #    afirmava o contrário e levou a trocar `require('fs')` por
      #    `await import('node:fs')` no `Post PR Comment on Failure` — o que
      #    reprovou 10 testes no run 38403842614 (13/10/2026), porque
      #    `tests/unit/github-workflows/test-coverage-comment.test.js` executa
      #    esse script com `require` e `fs` injetados e não roda sob
      #    `--experimental-vm-modules`. O `require('fs')` foi restaurado.
      # `grafana/setup-k6-action@v1` e as actions locais (`./.github/actions/*`)
      # ficaram fora do bump: não emitiram a annotation.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Auditoria como step explícito, e não mais como texto de warning do
      # `npm ci`. O `ci` instala com `--no-audit` (ver o composite `setup`), e
      # sem este step as vulnerabilidades — hoje 4 high — só apareceriam como
      # linhas de log que ninguém lê. `continue-on-error` mantém o gate atual:
      # este job reporta, não reprova. Quando as high forem zeradas, troque por
      # `continue-on-error: false` para passarem a barrar de verdade.
      - name: Audit Dependencies
        if: ${{ inputs.test-type == 'coverage' }}
        shell: bash
        run: npm audit --audit-level=high || echo "::warning::npm audit reportou vulnerabilidades high (não reprova o job)"
        continue-on-error: true
      # Checks estáticos de segurança: SQL injection e credenciais hardcoded.
      # Ambos reprovam o job (sem `continue-on-error`) — são análise estática,
      # não tocam no banco e não podem dar falso positivo por estado de runtime,
      # então uma reprovação aqui é sempre um achado real. Ficam ANTES do
      # `setup-db` de propósito: reprovar cedo não gasta o runner subindo
      # Postgres/Redis para uma bateria que não vai rodar.
      #
      # Contexto: nenhum workflow invocava `security:check-sql` — o
      # `check-sql-injection.js` existia desde sempre sem gate, e foi por isso
      # que `scripts/tests/manual-api-test.js` conseguiu entrar no repositório
      # com `password: 'password'` fixo (removido em 12/10/2026). Os dois
      # scanners agora têm executor automático.
      #
      # Sem `--all`: o escopo padrão já cobre `pages/`, `lib/`, `hooks/`,
      # `components/` e `scripts/` — que é onde vive código de aplicação. Use
      # `npm run security:check-credentials:all` / `security:check-sql:all`
      # localmente quando quiser varrer o repositório inteiro.
      - name: Security Checks (SQL injection + credenciais hardcoded)
        shell: bash
        run: |
          npm run security:check-sql
          npm run security:check-credentials
      # `skip-db-setup` skips the database setup when the suite does not touch
      # Postgres at all (e.g. coverage running in jsdom), avoiding pointless
      # migrations/seeds for a database the tests never query.
      - uses: ./.github/actions/setup-db
        if: ${{ !inputs.skip-db-setup }}
        with:
          seed: ${{ inputs.seed-db && 'true' || 'false' }}
      - uses: ./.github/actions/build-app
        with:
          admin-username: ${{ inputs.admin-username }}
          admin-password: ${{ inputs.admin-password }}
      # Versão PINADA de propósito: sem `k6-version` a action instala a latest a
      # cada semana, e uma mudança de versão pode alterar métricas, thresholds e
      # o comportamento de `responseCallback` sem que nada no repositório mude.
      # 2.3.0 é a versão que os runs #12–#14 (15–17/10/2026) instalaram, ou seja,
      # pinar aqui não altera o comportamento medido — só impede a deriva futura.
      # Para atualizar: conferir a release antes, e comparar o artifact do cron
      # (campo `metrics.*.thresholds`) contra o esperado.
      #
      # O valor é SEM o prefixo `v` — a action monta a URL como
      # `releases/download/v<k6-version>/k6-v<k6-version>-...`, então passar
      # `v2.3.0` produz `vv2.3.0` e 404. Comprovado no run #15 (18/10/2026):
      # `Downloading k6 version v2.3.0 from .../download/vv2.3.0/...` → 404.
      # A documentação da action usa o mesmo formato (`k6-version: '0.49.0'`).
      - if: ${{ !inputs.skip-k6 }}
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      # Os scripts k6 leem BASE_URL/ADMIN_USERNAME/ADMIN_PASSWORD por __ENV, e o
      # orquestrador (`execSync(..., { shell: true })`) herda o `process.env`
      # deste step — sem estas variáveis os testes autenticados falham: o
      # fallback de load-tests/helpers/config.js é '123456', que não é a senha
      # com que a app é iniciada aqui.
      - name: Run Tests
        run: ${{ inputs.run-command }}
        env:
          ADMIN_USERNAME: ${{ inputs.admin-username }}
          ADMIN_PASSWORD: ${{ inputs.admin-password }}
          BASE_URL: http://localhost:3000
      # `always()`, no mesmo padrão dos uploads de coverage abaixo: sem ele, uma
      # falha no `Run Tests` pularia os passos extras e os relatórios/k6-summaries
      # gerados até o momento nunca subiriam — justamente quando são necessários.
      - if: ${{ always() && inputs.extra-steps != '' }}
        name: Extra Steps
        run: ${{ inputs.extra-steps }}
      # Diagnóstico do servidor da aplicação. `build-app` sobe `npm start` com a
      # saída redirecionada para `app-server.log` no workspace (ver
      # `.github/actions/build-app/action.yml`); sem esta impressão, um 500 em
      # qualquer endpoint chega ao log do workflow apenas como "checks 0%" ou
      # "Página 1 vazia", sem causa. Foi o que tornou 12 reprovações do run
      # 37303670048 impossíveis de diagnosticar.
      #
      # `always()`: o log importa justamente quando os testes falharam. Fica
      # antes dos uploads para não competir com eles. `tail -200` e não o arquivo
      # inteiro porque, sob carga, o Next.js escreve dezenas de milhares de
      # linhas e o que interessa é o fim (a falha mais recente).
      - name: App Server Log
        if: ${{ always() }}
        run: |
          if [ ! -f "$APP_LOG" ]; then
            echo "app-server.log não encontrado: o build-app não chegou a subir a aplicação."
            exit 0
          fi
          echo "=== app-server.log: últimas 200 linhas ==="
          tail -n 200 "$APP_LOG"
        env:
          APP_LOG: ${{ github.workspace }}/app-server.log
      # Os relatórios k6 (reports/k6-summaries/) são gerados por esta execução e
      # variam a cada run: commitá-los poluiria o histórico com artefato de
      # execução (o ESLint já ignora reports/**), então o artifact é o destino
      # do relatório. O upload fica AQUI (e não no `extra-steps`) porque esse
      # input é interpolado num `run:` — shell não declara `uses:` — e um job
      # que chama workflow reutilizável não pode declarar `steps`.
      # `always()`: o orquestrador sai com código 1 quando algum script falha e é
      # justamente nesse caso que os summaries interessam. `if-no-files-found:
      # ignore` cobre abortos anteriores à geração dos relatórios.
      - name: Upload k6 Reports
        if: ${{ always() && inputs.test-type == 'load' }}
        uses: actions/upload-artifact@v7
        with:
          name: k6-load-test-reports
          path: reports/k6-summaries/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload Coverage Output
        if: ${{ always() && inputs.test-type == 'coverage' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-output
          path: coverage-output.txt
          retention-days: 7

      # O relatório HTML (coverage/) é gerado neste runner e está no .gitignore:
      # publicá-lo aqui é o que permite ao job `coverage-report` de
      # test-coverage.yml reenviá-lo como `jest-coverage-report`.
      - name: Upload Coverage HTML
        if: ${{ always() && inputs.test-type == 'coverage' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
