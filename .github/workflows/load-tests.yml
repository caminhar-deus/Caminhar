name: Load Tests (k6)

# Este workflow é o PRIMEIRO consumidor do `test-base.yml`: desde `65d1cd3`
# (quando foi criado como único workflow do repositório) ele nunca teve nenhum
# chamador, ou seja, os serviços PostgreSQL/Redis, o `setup-db`, o `build-app` e
# o k6 eram provisionados por ninguém — e nenhum dos 30 scripts k6 de
# `load-tests/` tinha chance de rodar na CI. Este arquivo fecha esse caminho.
#
# Por que NÃO há gatilho `pull_request`: teste de carga em PR é anti-padrão —
# é caro (sobe Postgres/Redis, `npm ci`, build, o Next.js e roda 30 scripts k6
# sequenciais, cada um com até 600 s de timeout), é flaky (runner compartilhado,
# ruído de CPU/rede) e mede o runner do GitHub, não a aplicação: latência e
# throughput de um hosted runner gratuito não dizem nada sobre o ambiente real.
# Carga se mede em ambiente controlado e em agendamento, nunca a cada push.
on:
  workflow_dispatch:
    inputs:
      admin-username:
        description: 'Usuário admin autenticado pelos scripts k6'
        required: false
        type: string
        default: 'admin'
      admin-password:
        description: 'Senha do admin autenticado pelos scripts k6'
        required: false
        type: string
        default: 'password123'
      seed-db:
        description: 'Semear o banco antes da bateria (desmarque só para depurar)'
        required: false
        type: boolean
        default: true
  schedule:
    # `cron: '17 4 * * *'` = 04:17 UTC = 01:17 no horário de Brasília. O minuto
    # é 17, e não 0, de propósito: o GitHub agenda todos os crons de minuto 0 no
    # mesmo instante e o pico do topo da hora atrasa (ou nem despacha) a
    # execução — desviar do minuto 0 evita disputar esse pico. O valor do cron
    # é mantido.
    #
    # CORREÇÃO (12/10/2026): a versão anterior deste comentário afirmava que a
    # execução acontecia "na madrugada, bem fora do horário comercial do
    # Brasil". A medição via API pública do GitHub desmente isso — o job NÃO
    # começa às 04:17 UTC:
    #
    #   run   run_started_at         atraso vs 04:17 UTC
    #   #9    2026-10-12T12:03:57Z   +7h47  (09:03 BRT = horário comercial)
    #   #7    2026-10-11T23:23:45Z   +19h07 (pior caso medido)
    #   #6    2026-10-10T10:38:34Z   +6h22  (melhor caso medido)
    #   #1    2026-10-05T11:33:14Z   +7h16
    #
    # Nas execuções agendadas medidas entre 05/10 e 12/10/2026 (runs #1 a #9,
    # inspecionados via API pública) o atraso variou de +6,4 h a +19,1 h, com 6
    # das 8 medições `schedule` entre +7,0 h e +8,1 h — ou seja, ~7 h de
    # atraso, não minutos. Um atraso de horas também não é explicado por fugir
    # do topo da hora: o minuto 17 continua sendo a escolha certa para não
    # disputar o pico do minuto 0, mas ele NÃO garante pontualidade.
    #
    # Origem do atraso: não é o `concurrency` group nem a fila de runners deste
    # repo — o `created_at` do run já nasce ~7 h depois do horário do cron, ou
    # seja, o run é criado atrasado antes de qualquer step deste workflow. Isso
    # aponta para a fila de agendamento do próprio GitHub; a causa raiz não foi
    # confirmada, apenas delimitada por essa evidência.
    # Consequência prática: o horário do cron NÃO deve ser tratado como
    # garantia de janela noturna (nem de qualquer janela) — quem precisar de
    # horário específico não pode depender deste agendamento.
    - cron: '17 4 * * *'

# Teste de carga só é comparável quando roda sozinho: dois runs simultâneos
# disputariam os runners do GitHub e os serviços (Postgres/Redis) de cada job,
# contaminando latência/throughput — e, havendo qualquer reuso do banco de
# serviço, os seeds e as limpezas de um run apagariam os dados do outro no meio
# da bateria. `cancel-in-progress: false` (e não `true`): nunca se mata um
# teste de carga no meio — um relatório parcial é pior do que esperar o run
# anterior terminar.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  load-tests:
    # Tempo REAL medido no run 38246676774 (cron "Load Tests (k6)" #9,
    # 12/10/2026, job `load-tests / run-tests`, 12:17:46Z -> 12:36:16Z =
    # 18m30s): setup inteiro ~1m45s (Initialize containers 35s, checkout 2s,
    # `npm ci` 59s, setup-db 1s, build 5s, setup-k6 1s; audit pulado) e a
    # bateria dos 30 scripts k6 — `Run Tests`, via `npm run test:load:safe` —
    # em 16m39s (~33s por script); upload dos relatórios 1s. 60 min dá ~3.6x
    # de folga sobre as 18m30s observadas e ainda derruba um job travado em 1
    # hora em vez de três.
    #
    # O cálculo anterior justificava 180 min com "caso realista 30–90 min +
    # 15–20 min de setup = 110 min"; esse número não bate com nenhuma execução
    # medida — a bateria inteira leva ~17 min, não 30–90.
    #
    # Teto teórico continua sendo o `execSync` de 600 s por script do
    # orquestrador (`scripts/run-all-load-tests-sequentially.js`): 30 × 600 s =
    # 300 min, e só se TODOS os scripts travarem até o timeout individual.
    # Esse caso é o que 60 min corta de propósito: um resultado parcial vale
    # mais do que 3 h de runner, e o log do step mostra exatamente onde travou.
    #
    # O limite é passado por `with:` porque um job que chama workflow
    # reutilizável não pode declarar `timeout-minutes` (o actionlint reprova e o
    # GitHub recusaria o arquivo): `test-base.yml` o recebe como input e o aplica
    # no job dele.
    uses: ./.github/workflows/test-base.yml
    with:
      test-type: load
      run-command: npm run test:load:safe
      skip-k6: false
      timeout-minutes: 60
      # `skip-db-setup` permanece em `false` (o default) de propósito: os 30
      # scripts batem em endpoints que LEEM do Postgres (paginação, busca,
      # listagens, cache) — sem migrations/seeds não há dados e a bateria
      # inteira reprovaria por vazio/404 em vez de reprovar uma regressão real.
      skip-db-setup: false
      # Em `schedule` o contexto `inputs` é vazio e a expressão viraria string
      # vazia (o default do `test-base` só cobre input totalmente ausente); o
      # `||` garante `true` em todo agendamento e preserva a escolha manual do
      # dispatch, cujo default também é `true`.
      seed-db: ${{ inputs.seed-db || github.event_name == 'schedule' }}
      # Propagação das credenciais do `workflow_dispatch`. O `||` com os mesmos
      # defaults do `test-base.yml` protege o agendamento, onde não há inputs —
      # sem ele a app subiria com credenciais vazias e os scripts autenticados
      # falhariam.
      admin-username: ${{ inputs.admin-username || 'admin' }}
      admin-password: ${{ inputs.admin-password || 'password123' }}
      # Relatório como artifact, e não commitado: reports/k6-summaries/ muda a
      # cada execução (o ESLint já o ignora via `reports/**`), então commitar
      # resultado de execução criaria diff ruidoso em todo run e misturaria
      # resultado velho com novo; artifact com `retention-days` preserva o JSON
      # de thresholds e os summaries para análise sem tocar no histórico.
      #
      # A não versionar é o que torna o artifact confiável, e isso precisou ser
      # aplicado de fato em 11/10/2026: os 40 arquivos de `reports/k6-summaries/`
      # estavam RASTREADOS pelo git (commits `48fa1cb`, `76071cf`) apesar deste
      # comentário afirmar o contrário, e o `.gitignore` não cobria `reports/`.
      # Consequência medida: na tentativa 1 do run 38133449606 — em que NENHUM
      # teste rodou, todos os steps de teste `skipped` — o `Upload k6 Reports`
      # publishou "40 files uploaded". O artifact era o conteúdo do repositório,
      # não resultado de teste. Desversionado e adicionado ao `.gitignore`.
      #
      # O `mkdir` garante o diretório de saída; o upload em si é um step do
      # próprio `test-base.yml` (`Upload k6 Reports`, com `retention-days` e
      # `if-no-files-found: ignore`), porque `extra-steps` é interpolado num
      # `run:` (shell não declara `uses:`) e um job que chama workflow
      # reutilizável não pode declarar `steps`.
      extra-steps: |
        mkdir -p reports/k6-summaries
