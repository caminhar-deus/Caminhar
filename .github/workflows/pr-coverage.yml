name: Lint & Test Coverage Gate

# Por que `push` para `main` e não só `pull_request`: o projeto faz push direto
# na `main`, então este workflow nunca executou e a `main` ficou sem nenhum
# gate de suíte. Em `push` o gate valida o estado EFETIVO da `main` depois do
# merge — e também cobre merge feito sem PR, revert e hotfix, que hoje não são
# verificados em lugar nenhum. `workflow_dispatch` permite rodar o mesmo gate
# sob demanda (bisect, revalidação de um SHA antigo).
#
# Custo aceito e NÃO deve ser "corrigido": o commit de merge roda duas vezes
# (uma no PR, outra no push para a `main`). É a contraparte de (A) + (B)
# juntos — o commit é testado no PR e reconfirmado na `main`. Suprimir uma das
# duas reintroduziria a lacuna que este gatilho veio fechar.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# O grupo é derivado do evento porque `github.event.pull_request` não existe em
# `push`: com um grupo fixo, `pr-coverage-${{ github.event.pull_request.number }}`
# viraria a string literal `pr-coverage-` e TODAS as execuções na `main`
# colidiriam num único grupo, se cancelando entre si.
#
# - `pull_request`: grupo por número de PR e `cancel-in-progress: true` — dois
#   pushes próximos no mesmo PR gerariam execuções concorrentes e o
#   `coverage-report` da mais antiga apagaria o comentário que a mais nova
#   acabou de publicar, republicando a saída de cobertura desatualizada.
# - `push`/`workflow_dispatch`: grupo por `github.ref` com
#   `cancel-in-progress: false`. O que isso faz de fato: o GitHub DESCARTA os
#   runs PENDENTES do mesmo grupo quando um novo entra na fila, mas nunca
#   interrompe o run já EM ANDAMENTO. Efeito prático: o `head` da `main` é
#   sempre validado, enquanto commits intermediários de um push rápido podem
#   ter a verificação pulada (fila descartada, não run morto no meio). É
#   justamente o comportamento desejado — não se interrompe um gate em
#   andamento, porque um resultado parcial é pior do que esperar (mesmo
#   raciocínio de `.github/workflows/load-tests.yml`).
#
# `format()` porque o `+` não concatena strings nas expressões do GitHub.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-coverage-pr-{0}', github.event.pull_request.number) || format('pr-coverage-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Menor privilégio no nível do workflow: `lint` e `coverage` só fazem checkout
# + `npm ci` e param com `contents: read` (exigido pelo actions/checkout). O
# `coverage-report` declara `permissions` próprias, que SUBSTITUEM as do
# workflow em vez de somar com elas — então nada se perde nesse job. Nenhum
# step precisa de mais do que isto.
permissions:
  contents: read

jobs:
  # Job autocontido de propósito — este é o único job do repositório que não
  # chama o workflow reutilizável `test-base.yml` (os workflows de carga,
  # segurança e CI continuam chamando).
  #
  # 1. A suíte de cobertura roda em jsdom e não consome nada do que o
  #    `test-base.yml` provisiona: serviços PostgreSQL/Redis, `setup-db`, build
  #    da aplicação e k6. Chamá-lo obrigava o runner a subir serviços e a
  #    construir/levantar o Next.js só para executar o jest.
  # 2. Referências locais a workflows reutilizáveis são obrigatoriamente do tipo
  #    `uses: ./.github/workflows/x.yml` e o language server da extensão
  #    "GitHub Actions" as resolve lendo o arquivo a partir do contexto de
  #    repositório recebido na inicialização. Quando o servidor sobe sem esse
  #    contexto, a leitura falha e o parser converte a falha em "Unable to find
  #    reusable workflow" — um falso positivo que aparece no editor mesmo com o
  #    workflow válido e executando normalmente no GitHub. Referências locais de
  #    *actions* (`.github/actions/*`) não passam por esse caminho e seguem
  #    funcionando.
  #
  # Se a cobertura voltar a depender do ambiente compartilhado, o caminho é
  # reintegrar o job ao `test-base.yml` (`test-type: coverage`, `skip-k6: true`,
  # `skip-db-setup: true`, `seed-db: false`) ciente do aviso do editor.
  # Gate de análise estática, separado do `coverage` e do `coverage-report` de
  # propósito.
  #
  # 1. `npm run lint` (ESLint sobre JS/JSX/CSS/Markdown/JSON) é determinístico e
  #    não precisa de banco nem de build. Dentro do `coverage-report` ele só
  #    rodaria depois de `npm ci` + jest com coverage, ou seja, minutos depois de
  #    a informação estar disponível — e dividiria o status com a publicação do
  #    comentário, fazendo "falhou o lint?" ser indistinguível de "falhou a
  #    cobertura?".
  # 2. Ele também é o único gate que não existia: `actionlint` e `knip` já
  #    rodavam no `coverage-report`, mas ESLint não era executado em lugar
  #    nenhum da CI. Sem job, nenhum erro de lint era detectado antes do merge —
  #    o comando existia e funcionava, apenas não era gate de ninguém.
  #
  # Reprovação aqui NÃO bloqueia o merge por configuração do repositório: só
  # passa a ser obrigatório quando este check for marcado como required nas
  # settings de branch protection do repositório.
  lint:
    runs-on: ubuntu-latest
    # Folga para não reprovar por lentidão (ESLint sobre o repo inteiro é
    # determinístico, só demora); teto para derrubar um runner travado em vez
    # de queimar os 360 min do default.
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: npm run lint

  coverage:
    runs-on: ubuntu-latest
    # Folga maior porque é a suíte inteira com instrumentação de cobertura
    # (baseline local: ~20 s de jest puro, minutos no runner frio com `npm ci`);
    # teto para derrubar um jest travado em vez de queimar os 360 min do
    # default do runner.
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup

      # `set -o pipefail` é o que propaga o exit code do jest: sem ele o status
      # do step seria o do `tee` (sempre zero) e uma cobertura abaixo do mínimo
      # passaria como sucesso — o comentário no PR depende de o job falhar.
      #
      # `--ci` é redundância EXPLÍCITA: o jest já liga o modo CI por padrão
      # quando detecta `isCI`, e o runner do GitHub tem `CI=true` — o comando
      # antigo já rodava em modo CI lá. O que o flag garante é o modo CI também
      # na execução LOCAL (fora de CI, sem `CI` setado), onde um snapshot criado
      # pela primeira vez seria gravado silenciosamente em vez de reprovar. Ele
      # também dá propósito ao `--ci` do script `test:ci` do package.json, cujo
      # único chamador de CI era o `ci.yml`, já removido.
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          npx jest --ci --coverage | tee coverage-output.txt

      # `always()` mantém a saída publicada mesmo quando os thresholds reprovam
      # a execução: é justamente esse arquivo que o `coverage-report` baixa para
      # publicar o comentário no PR.
      - name: Upload Coverage Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-output
          path: coverage-output.txt
          retention-days: 7

      # O relatório HTML é gerado neste runner e `coverage/` está no
      # .gitignore, então o upload é o que permite ao `coverage-report`
      # republicá-lo como `jest-coverage-report`.
      - name: Upload Coverage HTML
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  coverage-report:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    # Folga para `npm ci` + actionlint + knip sobre o repo inteiro; teto para
    # derrubar um runner travado em vez de queimar os 360 min do default.
    timeout-minutes: 20

    # Necessário para permitir que a Action crie/remova comentários no PR.
    # Declarar `permissions` redefine todas as permissões não listadas para
    # `none`, por isso `contents: read` (exigido pelo actions/checkout) é
    # obrigatório: sem ele o checkout falha e o job inteiro para.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup

      # `continue-on-error` impede que a ausência do artefato aborte o job:
      # se os testes falharem antes de gerar a saída, o download retorna erro
      # e derruba o run — nenhum dos dois downloads tem `if` algum, então o
      # `always()` que existe está no job (que decide se ele roda) e nos
      # uploads, nunca aqui.
      - name: Download Coverage Output
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-output

      # O relatório HTML é gerado no runner do job de testes (coverage/ está
      # no .gitignore e não vem no checkout), então precisa ser baixado aqui
      # antes de ser republicado em `Upload Coverage HTML Report`.
      - name: Download Coverage HTML Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-html
          path: coverage

      # Guarda de evento: `context.issue.number` só existe em `pull_request`.
      # Em `push` (ou `workflow_dispatch`) não há número de PR no contexto e o
      # `github-script` lançaria erro, derrubando o job — e não há comentário
      # antigo a remover de qualquer maneira.
      - name: Remove Old Coverage Comments
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // A API pagina em 30 comentários por padrão; sem `per_page` o
            // comentário antigo de cobertura deixaria de ser encontrado em PRs
            // movimentados e o step acumularia comentários duplicados.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const botComments = comments.filter(c => 
              c.user?.type === 'Bot' && 
              (c.body || '').includes('### ❌ Cobertura de Testes Abaixo do Mínimo Exigido')
            );
            for (const comment of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

      # Duas condições, ambas obrigatórias: a falha da cobertura (original) e o
      # `event_name`, porque comentar no PR só faz sentido em `pull_request` —
      # em `push` não existe PR e `context.issue.number` quebraria o script.
      - name: Post PR Comment on Failure
        if: ${{ github.event_name == 'pull_request' && needs.coverage.result == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // A API de comentários do GitHub aceita no máximo 65536 caracteres
            // por comentário; o restante do template (título, <details>, cerca do
            // bloco) consome parte desse orçamento.
            const MAX_CHARS = 60000;

            let output = fs.existsSync('coverage-output.txt')
              ? fs.readFileSync('coverage-output.txt', 'utf8')
              : '(saída de cobertura indisponível: o job de testes falhou antes de gerar coverage-output.txt)';

            // A saída entra no template literal como VALOR (`${output}`), não é
            // reavaliada como código: crases e `${` do texto não quebram o script
            // e não devem ser "escapados" — o escape só acrescentaria barras
            // invertidas visíveis no comentário publicado.

            // A saída desta suíte passa de 170 KB e o começo é ruído (linhas PASS
            // e console.error de cada suíte). O que explica a reprovação — a
            // tabela de cobertura e as linhas "coverage threshold ... not met" —
            // fica no FIM, então é o fim que precisa sobreviver ao corte.
            const coverageTableHeader = output.indexOf('Uncovered Line #s');
            if (coverageTableHeader !== -1) {
              // Da linha que abre a tabela de cobertura até o fim: a tabela, os
              // thresholds violados e o resumo da execução.
              output = output.slice(output.lastIndexOf('\n', coverageTableHeader) + 1);
            }

            if (output.length > MAX_CHARS) {
              const truncationMarker = '... (início da saída truncado)\n\n';
              output = truncationMarker + output.slice(-(MAX_CHARS - truncationMarker.length));
            }

            const comment = `### ❌ Cobertura de Testes Abaixo do Mínimo Exigido\nSua alteração resultou em uma cobertura de testes abaixo dos thresholds definidos (Branches: 80% | Functions: 85% | Lines: 90% | Statements: 90%).\n\n<details>\n<summary>📊 Ver Detalhes da Cobertura</summary>\n\n\`\`\`text\n${output}\n\`\`\`\n</details>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: jest-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      # As duas análises estáticas vêm depois do comentário e do upload de
      # propósito: ambas podem reprovar a execução e, se viessem antes,
      # suprimiriam os steps acima. O `actionlint` é determinístico e rápido —
      # valida os workflows e as actions compostas do repositório (sintaxe,
      # expressões, `needs`, `with:` de workflows reutilizáveis, incluindo os
      # locais, e shellcheck nos `run:` quando disponível) — e o `knip` fica por
      # último porque retorna exit code 1 ao encontrar código morto.
      - name: Run actionlint (Workflow Lint)
        run: npm run lint:workflows

      - name: Run Knip (Dead Code Analysis)
        run: npm run knip
